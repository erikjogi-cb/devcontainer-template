# Firewall allow-list — hosts the devcontainer may reach outbound.
#
# One host per line. Lines starting with # and blank lines are ignored.
# A host may carry a ":port" suffix — "example.com:7070" opens that TCP port
# alone, where a bare host opens every port. Use it for a single service.
# Append the word "dynamic" after a host to also refresh it every 10s: use it
# for hosts with short-TTL / rotating IPs (a single boot-time resolve goes
# stale), and for hosts that resolve only sometimes, such as a host behind the
# VPN. Plain hosts are resolved once at boot and must resolve (boot fails
# loudly if they don't); dynamic hosts are resolved leniently and kept topped
# up by the background refresher.
#
# Read by init-firewall.sh. Edit here, then apply with
# devcontainer-firewall-restart.sh (no container rebuild needed).
#
# GitHub and AWS S3 (eu-central-1) IP ranges are handled separately in the
# script — they come from published range APIs, not plain DNS.


# --- Codeborne ---
fm.codeborne.com

# --- Services on the developer machine ---
# Docker Desktop puts the host at this name, which resolves from /etc/hosts
# rather than DNS. Give the port of the service the app calls on the host.
#host.docker.internal:7070

